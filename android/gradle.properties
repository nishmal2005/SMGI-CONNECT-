# ── Gradle JVM ────────────────────────────────────────────────
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
org.gradle.parallel=false

# ── Android ───────────────────────────────────────────────────
android.useAndroidX=true

# ── Kotlin ────────────────────────────────────────────────────
kotlin.incremental=false

# ── AGP 9.0 compatibility for Flutter ─────────────────────────
# These two flags were added by the Flutter migrator and are REQUIRED
# on AGP 9.0+ so the Flutter Gradle plugin can apply against the
# legacy Kotlin Gradle Plugin path (KGP 2.2.20) instead of AGP's
# bundled Kotlin 2.2.10, which is below Flutter's minimum.
#
# DO NOT REMOVE until Flutter officially supports Built-in Kotlin.
#
# Deprecation warnings from Gradle are expected and harmless.
android.builtInKotlin=false
android.newDsl=false
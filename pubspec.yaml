name: smgi.connect
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  razorpay_flutter: ^1.3.7
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  dotted_border: ^3.1.0
  http: ^1.2.0
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.2.2
  image_picker: ^1.0.0
  file_picker: ^10.3.8
  mobile_scanner: ^5.2.3
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.0.17
  flutter_image_compress: ^2.5.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  assets:
    - assets/icons/
    - assets/images/banner.png
    - assets/images/logo.png
    - assets/images/onboarding1.png
    - assets/images/onboarding2.png
    - assets/images/onboarding3.png
    - assets/images/onboarding_bg.png
    - assets/images/Splashscreen.png
    - assets/images/homebanner.png
    - assets/images/cardicon.png
    - assets/images/download.png
    - assets/images/downloadicon.png
    - assets/images/person.jpeg
    - assets/images/download.png
    - assets/images/fileicon.png
    - assets/images/warningicon.png
    - assets/images/Onboarding1.jpg
    - assets/images/Payment Success.png
    - assets/images/success.png
    - assets/images/adharimg.png

  uses-material-design: true

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
